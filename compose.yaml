name: envy

x-service: &service
  image: envy-app:local
  build: .
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  networks: [internal]
  restart: unless-stopped
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=700
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-environment: &environment
  DATA_DIR: /uploads
  DATABASE_URL: "postgresql+psycopg://envy:${POSTGRES_PASSWORD:?Run scripts/setup.ps1 to create .env}@db:5432/envy"
  BROKER_URL: "redis://:${REDIS_PASSWORD:?Run scripts/setup.ps1 to create .env}@broker:6379/0"
  CACHE_URL: "redis://:${REDIS_PASSWORD:?Run scripts/setup.ps1 to create .env}@cache:6379/0"
  INFERENCE_URL: http://inference:8001
  PIPELINE_VERSION: "${PIPELINE_VERSION:-envy-pe-v4}"

services:
  volume-init:
    image: python:3.11-slim
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    command:
      - python
      - -c
      - "import os; [(os.chmod(p, 0o700), os.chown(p, 10001, 10001)) for p in ('/uploads', '/spool')]"
    volumes:
      - uploads:/uploads
      - api-spool:/spool
    restart: "no"
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

  api:
    <<: *service
    networks: [internal, frontend]
    environment:
      <<: *environment
      TMPDIR: /spool
    command: ["python", "-m", "uvicorn", "envy.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - uploads:/uploads
      - api-spool:/spool
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 96
    depends_on:
      volume-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      cache:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  inference:
    <<: *service
    environment:
      MODEL_PATH: /models/EMBER2024_PE.model
      PIPELINE_VERSION: "${PIPELINE_VERSION:-envy-pe-v4}"
    command: ["python", "-m", "uvicorn", "envy.inference:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  worker:
    <<: *service
    environment: *environment
    command: ["python", "-m", "celery", "-A", "envy.tasks:celery_app", "worker", "--pool=prefork", "--concurrency=1", "--prefetch-multiplier=1", "--loglevel=INFO"]
    volumes:
      - type: volume
        source: uploads
        target: /uploads
        read_only: true
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy
      cache:
        condition: service_healthy
    # No host ports, Docker socket, model mount or host-directory mount.

  broker:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run scripts/setup.ps1 to create .env}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Run scripts/setup.ps1 to create .env}"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction"]
    volumes: ["broker-data:/data"]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  cache:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run scripts/setup.ps1 to create .env}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Run scripts/setup.ps1 to create .env}"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy allkeys-lru --save '' --appendonly no"]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: envy
      POSTGRES_DB: envy
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run scripts/setup.ps1 to create .env}"
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 96
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

networks:
  internal:
    internal: true
  frontend:
    driver: bridge  


volumes:
  uploads:
  api-spool:
  broker-data:
  postgres-data:
